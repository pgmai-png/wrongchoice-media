<!doctype html>
<meta charset="utf-8">
<title>pasar</title>
<script>
// Cargada dentro de TikTok Studio (como marco), descarga el vídeo que se le pide en el hash
// (#videos/ep05.mp4) desde este mismo sitio y se lo manda a la página de arriba con postMessage.
(async () => {
  const ruta = decodeURIComponent(location.hash.slice(1));
  try {
    if (!/^videos\/[\w.-]+\.mp4$/.test(ruta)) throw new Error('ruta no válida');
    const r = await fetch('https://raw.githubusercontent.com/pgmai-png/wrongchoice-media/main/' + ruta);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const b = await r.blob();
    parent.postMessage({tipo: 'video-wc', nombre: ruta.split('/').pop(), blob: b}, '*');
  } catch (e) {
    parent.postMessage({tipo: 'video-wc-error', error: String(e)}, '*');
  }
})();
</script>
